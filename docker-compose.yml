# Local PostgreSQL for machines with Docker (LOCAL_DB_MODE=docker, ADR-004).
# The build laptop runs PostgreSQL natively instead; CI uses a postgres:18 service container.
# Start and stop it with `pnpm db:up` / `pnpm db:down`, which load .env.local first.
#
# Postgres 18 matches Neon's default. Settings mirror Neon and the native install: UTF8 with the
# builtin C.UTF-8 locale, UTC. The citext and pg_trgm extensions ship with the image; Phase 2's
# init migration creates them (ADR-019), so none are pre-created here.

name: futureuni

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Local development only; never used outside this container.
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: futureuni_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C"
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to this machine only.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # From Postgres 18 the image keeps data in /var/lib/postgresql/18/docker, so the volume
      # mounts one level up (docker-library/postgres#1259).
      - futureuni-postgres:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d futureuni_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  futureuni-postgres:
